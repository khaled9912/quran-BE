name: ana-quran-academy

services:
  postgres:
    image: postgres:17-alpine
    container_name: ana-quran-academy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: academy
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-db-password}
    ports:
      - "5432:5432"
    volumes:
      - academy-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy -d academy"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: ana-quran-academy-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Academy: Host=postgres;Port=5432;Database=academy;Username=academy;Password=${POSTGRES_PASSWORD:-change-this-db-password}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:-}
      AllowedOrigins: ${ALLOWED_ORIGINS:-http://localhost:3000}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-admin@anaquranacademy.local}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe123}
      Database__EnsureCreated: "true"
      Otp__DevMode: ${OTP_DEV_MODE:-false}
      Otp__Sender: ${OTP_SENDER:-}
      Otp__TextBee__ApiKey: ${TEXTBEE_API_KEY:-}
      Otp__TextBee__DeviceId: ${TEXTBEE_DEVICE_ID:-}
      Email__Enabled: ${EMAIL_ENABLED:-false}
      Email__SmtpHost: ${EMAIL_SMTP_HOST:-}
      Email__SmtpPort: ${EMAIL_SMTP_PORT:-587}
      Email__Username: ${EMAIL_USERNAME:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__From: ${EMAIL_FROM:-}
      Email__To: ${CONTACT_RECEIVER_EMAIL:-}
      # Browser notifications: inert until both halves of a VAPID pair exist.
      WebPush__PublicKey: ${WEBPUSH_PUBLIC_KEY:-}
      WebPush__PrivateKey: ${WEBPUSH_PRIVATE_KEY:-}
      WebPush__Subject: ${WEBPUSH_SUBJECT:-mailto:support@anaquran.com}
      LessonRoom__Transcription: ${LessonRoom__Transcription:-false}
      LessonRoom__ReportConcern: ${LessonRoom__ReportConcern:-false}
      Transcripts__LightCaptureSince: ${Transcripts__LightCaptureSince:-}
      # Observability: both are inert unless set (Sentry is also production-only).
      SENTRY_DSN: ${SENTRY_DSN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-academy-api}
    ports:
      - "5001:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  academy-postgres:
    name: ana-quran-academy-postgres

networks:
  default:
    name: ana-quran-academy-network
