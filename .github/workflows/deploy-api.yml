name: Deploy API to MonsterASP

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: >
          dotnet publish src/Academy.Api/Academy.Api.csproj
          -c Release -o publish /p:UseAppHost=false

      - name: Trim build-only files
        run: |
          rm -rf publish/BuildHost-net472 publish/BuildHost-netcore
          rm -f publish/*.pdb publish/Academy.Api
          # The server owns web.config: it holds the production environment
          # variables (DATABASE_URL, AllowedOrigins, ...). Never upload it.
          rm -f publish/web.config

      - name: Deploy over SFTP
        env:
          SFTP_HOST: ${{ secrets.MONSTER_SFTP_HOST }}
          SFTP_USER: ${{ secrets.MONSTER_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.MONSTER_SFTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          # IIS keeps the running app's dlls locked, which makes the mirror fail
          # with "file is being used by another process". app_offline.htm makes
          # the ASP.NET Core Module unload the app so the files can be replaced.
          cat > app_offline.htm <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Ana Quran API update</title>
          <p style="font-family:sans-serif;text-align:center;padding:4rem">Updating the API. Please refresh in a minute.</p>
          HTML

          lftp_cmd() {
            lftp -c "set sftp:auto-confirm yes; set net:timeout 30; set net:max-retries 3; open -u \"$SFTP_USER\",\"$SFTP_PASSWORD\" sftp://$SFTP_HOST:22; $1"
          }

          # Never leave the site showing the offline page, even when a step fails.
          trap 'lftp_cmd "rm -f /wwwroot/app_offline.htm"' EXIT

          lftp_cmd "put app_offline.htm -o /wwwroot/app_offline.htm"
          sleep 8
          lftp_cmd "mirror -R --delete --parallel=4 \
            -x 'web.config' \
            -x 'logs' \
            -x 'logs/*' \
            -x 'app_offline.htm' \
            ./publish /wwwroot"

      - name: Verify the API came back
        run: |
          for attempt in $(seq 1 15); do
            body=$(curl -s https://anaquran.runasp.net/health || true)
            if [[ "$body" == *ana-quran-academy-api* ]]; then
              echo "API healthy after $attempt attempt(s)."
              exit 0
            fi
            sleep 5
          done
          echo "API did not become healthy within 75s."
          exit 1

