name: CI

# The gate for master. deploy-api.yml runs after a merge, this runs before one.

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build AnaQuranAcademy.sln -c Release /p:UseAppHost=false

      - name: No vulnerable packages
        run: |
          dotnet list AnaQuranAcademy.sln package --vulnerable --include-transitive \
            | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "A referenced package has a security advisory. Bump it before merging."
            exit 1
          fi

      # The suite boots a throwaway postgres:17 container per run (Testcontainers),
      # so the runner's firewall has to let the container talk to the test process.
      - name: Allow Testcontainers traffic
        run: sudo ufw disable || true

      - name: Security regression tests
        run: >
          dotnet test tests/Academy.SecurityTests/Academy.SecurityTests.csproj
          -c Release --no-build --nologo
